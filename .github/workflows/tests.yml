name: Tests

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The panel runs on Windows; Linux is where the auto-fix workflow runs Claude.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"  # KiCad 10 ships Python 3.11
      - name: Run tests
        run: python -m unittest discover -s tests -v
