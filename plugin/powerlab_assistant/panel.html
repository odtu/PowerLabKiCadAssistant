<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #faf9f7; --surface: #ffffff; --surface-2: #f1efea; --border: #e4e1da;
  --text: #1f1e1c; --muted: #77746d; --accent: #d71920; --accent-ink: #ffffff; --logo-ink: #111111;
  --user-bg: #ece9e2; --ok: #3f8f5a; --err: #c9493b; --warn: #b7791f;
  --code-bg: #f1efea; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1c1a; --surface: #262522; --surface-2: #2f2d2a; --border: #3a3834;
    --text: #ecebe8; --muted: #9b978f; --accent: #f0464d; --accent-ink: #ffffff; --logo-ink: #f2f2f2;
    --user-bg: #34322e; --ok: #6cc08b; --err: #ef7a6c; --warn: #e3ac55;
    --code-bg: #2f2d2a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }

/* header */
header {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.brand svg, .lockup svg { display: block; width: 100%; height: 100%; }
.brand { width: 28px; height: 28px; flex: none; color: var(--logo-ink); }
.lockup { display: flex; justify-content: center; margin: 0 auto 18px; }
.lockup .lab { width: 64px; height: 64px; color: var(--logo-ink); }
.title { font-weight: 600; font-size: 13.5px; }
.status .org { color: var(--muted); }

/* library bar */
.libbar {
  display: none; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px;
  background: var(--surface-2); border-bottom: 1px solid var(--border); color: var(--muted);
}
.libbar.show { display: flex; }
.libbar .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.libbar.warn { color: var(--warn); }

/* sheets: notice, report, share */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end;
  background: rgba(0, 0, 0, .45); animation: fade .15s ease-out;
}
.overlay.open { display: flex; }
.sheet {
  width: 100%; max-height: calc(100% - 24px); overflow-y: auto; margin: 12px; padding: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
  animation: rise .18s ease-out;
}
.sheet h2 { font-size: 15px; margin: 0 0 8px; }
.sheet p, .sheet li { font-size: 12.5px; color: var(--text); }
.sheet p { margin: 0 0 10px; }
.sheet ul { margin: 0 0 12px; padding-left: 18px; }
.sheet li { margin-bottom: 7px; }
.sheet .muted, .sheet .small { color: var(--muted); font-size: 11.5px; }
.sheet label, .sheet .label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
.sheet label .muted { font-weight: 400; }
.sheet input[type=text], .sheet textarea {
  display: block; width: 100%; margin-top: 4px; padding: 7px 9px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-weight: 400;
}
.sheet textarea { resize: vertical; }
.sheet input:focus, .sheet textarea:focus { outline: none; border-color: var(--accent); }
.sheet pre {
  font: 11px/1.45 "Cascadia Code", Consolas, monospace; background: var(--code-bg); border-radius: 8px;
  padding: 8px 10px; max-height: 170px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0;
}
.sheet .tip { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin: 10px 0 0; }
.sheet .ok { color: var(--ok); margin: 10px 0 0; }
.sheet .bad { color: var(--err); margin: 10px 0 4px; }
.sheet .files { border: 1px solid var(--border); border-radius: 8px; padding: 4px 0; max-height: 150px; overflow: auto; }
.sheet .files label { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 0; padding: 3px 10px; font-size: 12px; }
.sheet .files code { font-size: 11.5px; word-break: break-all; }
.sheet .files .st { color: var(--muted); font-size: 11px; width: 28px; flex: none; }
.actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 12.5px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: inherit; text-decoration: underline; }
.libbar .btn { padding: 1px 10px; font-size: 11.5px; flex: none; }
.disclaimer { font-size: 10px; color: var(--muted); text-align: center; margin-top: 6px; line-height: 1.35; }
@keyframes fade { from { opacity: 0; } }
.status { color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 5px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.busy .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.spacer { flex: 1; }
.icon-btn {
  border: 0; background: transparent; border-radius: 6px; padding: 5px; display: grid; place-items: center;
  color: var(--muted);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; }

/* messages */
#log { flex: 1; overflow-y: auto; padding: 14px 12px 6px; scroll-behavior: smooth; }
#log::-webkit-scrollbar { width: 8px; }
#log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.msg { margin: 0 0 12px; animation: rise .18s ease-out; }
.user { display: flex; justify-content: flex-end; }
.user .bubble {
  background: var(--user-bg); padding: 7px 11px; border-radius: 14px 14px 4px 14px;
  max-width: 88%; white-space: pre-wrap; word-wrap: break-word;
}
.assistant { word-wrap: break-word; }
.assistant p { margin: 0 0 8px; }
.assistant p:last-child { margin-bottom: 0; }
.assistant h1, .assistant h2, .assistant h3 { font-size: 13.5px; margin: 10px 0 4px; }
.assistant ul, .assistant ol { margin: 0 0 8px; padding-left: 20px; }
.assistant li { margin: 2px 0; }
.assistant code {
  font-family: "Cascadia Code", Consolas, monospace; font-size: 12px;
  background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
}
.assistant pre {
  background: var(--code-bg); padding: 9px 11px; border-radius: 8px; overflow-x: auto; margin: 0 0 8px;
}
.assistant pre code { background: none; padding: 0; }
.assistant a { color: var(--accent); }
/* a place on the board: click to select it and zoom to it in KiCad */
a.loc { color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
a.loc::after { content: ' \2316'; font-size: .9em; text-decoration: none; display: inline-block; margin-left: 1px; }
a.loc:hover { text-decoration-style: solid; }
.assistant table { border-collapse: collapse; margin: 0 0 8px; font-size: 12px; display: block; overflow-x: auto; }
.assistant th, .assistant td { border: 1px solid var(--border); padding: 3px 7px; text-align: left; }
.assistant th { background: var(--surface-2); }

/* tool activity */
.tools {
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
  padding: 4px 0; margin: 0 0 12px; animation: rise .18s ease-out;
}
.tool { display: flex; align-items: center; gap: 8px; padding: 3px 10px; font-size: 12px; min-width: 0; }
.tool .name { font-weight: 500; white-space: nowrap; }
.tool .detail { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.err-text { color: var(--err); font-size: 11.5px; padding: 0 10px 4px 32px; }
.ti { width: 14px; height: 14px; flex: none; display: grid; place-items: center; }
.ti.run { border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
.ti.ok { color: var(--ok); } .ti.bad { color: var(--err); }
.ti svg { width: 14px; height: 14px; }

/* answer buttons for Claude's questions */
.choices {
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
  padding: 8px 10px 10px; margin: 0 0 12px; animation: rise .18s ease-out;
}
.choices .q { font-weight: 600; font-size: 12.5px; margin: 6px 0 5px; }
.choices .q:first-child { margin-top: 0; }
.choices .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt {
  border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 4px 10px;
  font-size: 12.5px; text-align: left; transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.rec { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.opt .tag { display: inline; color: var(--muted); font-size: 11px; }
.opt.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.sel .tag { color: inherit; opacity: .8; }
.opt:disabled { cursor: default; }
.choices.done .opt:not(.sel) { opacity: .45; }
.choices .foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--muted); }
.choices .foot .btn { margin-left: auto; padding: 2px 10px; font-size: 12px; }
.choices.done .foot { display: none; }
.choices .other-in {
  display: none; width: 100%; margin-top: 6px; padding: 5px 9px; font: inherit; font-size: 12.5px;
  border: 1px solid var(--accent); border-radius: 8px; background: var(--bg); color: var(--text); outline: none;
}
.choices .other-in.open { display: block; }
.choices.done .other-in { border-color: var(--border); opacity: .7; }
/* notes */
.note { font-size: 12px; padding: 8px 10px; border-radius: 8px; margin: 0 0 12px; display: flex; gap: 8px; align-items: flex-start; }
.note.error { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
.note.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.note.info { background: var(--surface-2); color: var(--muted); }
.note button {
  margin-left: auto; flex: none; border: 1px solid currentColor; background: transparent;
  border-radius: 6px; padding: 1px 8px; font-size: 11.5px;
}
.meta { color: var(--muted); font-size: 11px; margin: -6px 0 14px; }
.shot {
  margin: 0 0 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  background: var(--surface); animation: rise .18s ease-out;
}
.shot img { display: block; width: 100%; max-height: 320px; object-fit: contain; cursor: zoom-in; background: var(--surface-2); }
.shot .cap { font-size: 11px; color: var(--muted); padding: 4px 9px; }
/* the final design review (powerlab-design-review), with its PDF */
.review {
  margin: 0 0 12px; border: 1px solid var(--accent); border-radius: 10px; background: var(--surface);
  animation: rise .18s ease-out; overflow: hidden;
}
.review .head { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.review .head .t { font-weight: 600; font-size: 13px; }
.review .head .v { font-size: 12px; color: var(--muted); margin-top: 2px; }
.review .head .btn { margin-left: auto; flex: none; padding: 2px 10px; font-size: 12px; }
.review .err { font-size: 11.5px; color: var(--warn); padding: 6px 10px 0; }
.review details { padding: 4px 10px 8px; }
.review summary { cursor: pointer; font-size: 12px; color: var(--muted); user-select: none; padding: 2px 0; }
.review .body { margin-top: 6px; }
.review .body h1 { display: none; }  /* the title is in the head */
.review .body h3.sev { display: inline-block; padding: 1px 8px; border-radius: 8px; color: #fff; font-size: 12px; }
.review .body .sev-critical { background: #b42318; } .review .body .sev-high { background: #c4570c; }
.review .body .sev-medium { background: #a37b00; } .review .body .sev-low { background: #3e6a9c; }
.review .body .sev-cosmetic { background: #6b7480; }
.review .body td:nth-child(-n+2) { white-space: nowrap; }  /* # and rule ID */
.review .body figure { margin: 6px 0 10px; }
.review .body img { display: block; width: 100%; max-height: 320px; object-fit: contain; cursor: zoom-in; border-radius: 6px; background: var(--surface-2); }
.review .body figcaption { font-size: 11px; color: var(--muted); padding-top: 3px; }
.review .body .missing { color: var(--err); font-size: 12px; }
/* the block plan (powerlab-placement): click a block to select its parts in KiCad */
.plan {
  margin: 0 0 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
  animation: rise .18s ease-out; overflow: hidden; box-shadow: var(--shadow);
}
.plan .head { display: flex; align-items: center; gap: 8px; padding: 9px 10px 8px; }
.plan .head .t { font-weight: 600; font-size: 13px; }
.plan .head .v { font-size: 11.5px; color: var(--muted); }
.plan .seg { margin-left: auto; display: flex; background: var(--surface-2); border-radius: 7px; padding: 2px; flex: none; }
.plan .seg button { border: 0; background: transparent; font-size: 11px; padding: 2px 8px; border-radius: 5px; color: var(--muted); }
.plan .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.plan .canvas {
  position: relative; margin: 0 8px; border-radius: 9px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, #13213a 0%, #0a1222 70%, #070d19 100%);
}
.plan .plan-svg { display: block; width: 100%; height: auto; max-height: 460px; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
.plan .board { fill: #0e1a2e; }
.plan .grid { stroke: #7f9cc4; stroke-opacity: .07; stroke-width: .12; }
.plan .edge { fill: none; stroke: #c8d6ea; stroke-width: .35; stroke-opacity: .85; }
.plan .cut { fill: #070d19; stroke: #c8d6ea; stroke-width: .3; stroke-opacity: .7; }
.plan .hole { fill: #070d19; stroke: #e5c07b; stroke-width: .45; }
.plan .keepout { fill: #8aa0bf; fill-opacity: .07; stroke: #8aa0bf; stroke-opacity: .35; stroke-width: .2; stroke-dasharray: .8 .6; pointer-events: none; }
.plan .blk { cursor: pointer; outline: none; transition: opacity .15s; }
.plan .blk .body { stroke-width: .35; stroke-linejoin: round; transition: stroke-width .12s, fill-opacity .12s; }
.plan .blk.top .body { fill-opacity: .16; }
.plan .blk .nm { fill: #f3f6fb; font-weight: 600; text-anchor: middle; letter-spacing: .02em; pointer-events: none; }
.plan .blk .dt { fill: #b7c3d6; text-anchor: middle; pointer-events: none; }
.plan .blk:hover .body, .plan .blk.hot .body { stroke-width: .6; filter: url(#glow); }
.plan .blk.top:hover .body, .plan .blk.top.hot .body { fill-opacity: .32; }
.plan .blk.sel .body { stroke: #ffffff; stroke-width: .7; filter: url(#glow); }
.plan .link, .plan .pill-g { pointer-events: none; }
.plan .pill-g.empty { display: none; }
.plan .pill-g.live .pill { fill: #101c33; stroke-width: .3; }
.plan .blk .base { fill: #0e1a2e; }
.plan .blk.drag { cursor: grabbing; }
.plan .blk.drag .body { stroke: #ffffff; stroke-width: .6; fill-opacity: .4; }
.plan .row .s { cursor: pointer; background: transparent; font-family: inherit; }
.plan .row .s:hover { color: var(--text); border-color: var(--muted); }
.plan .moves { margin: 6px 10px 0; padding: 8px 10px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 8%, var(--surface-2)); }
.plan .moves .mt { font-size: 12px; font-weight: 600; }
.plan .moves ul { margin: 4px 0 6px; padding-left: 16px; font-size: 11.5px; color: var(--muted); }
.plan .moves .mb { display: flex; gap: 6px; justify-content: flex-end; }
.plan .moves .btn { padding: 2px 10px; font-size: 12px; }
.plan .selbar { display: none; align-items: center; gap: 8px; margin: 6px 8px 0; padding: 6px 8px; border-radius: 9px; background: var(--surface-2); }
.plan .selbar.open { display: flex; }
.plan .selbar .dot { flex: none; width: 10px; height: 10px; border-radius: 3px; }
.plan .selbar .dot.b { background: transparent !important; border: 1.5px dashed; }
.plan .selbar .n { font-size: 12.5px; font-weight: 600; }
.plan .selbar .w { font-size: 11.5px; color: var(--muted); }
.plan .selbar { flex-wrap: wrap; }
.plan .selbar .w { margin-right: auto; }
.plan .selbar .rot { flex-basis: 100%; display: flex; align-items: center; gap: 5px; padding-top: 4px; border-top: 1px solid var(--border); margin-top: 2px; }
.plan .selbar .rot span { font-size: 11.5px; color: var(--muted); margin-right: 2px; }
.plan .selbar .rot input { width: 64px; font: inherit; font-size: 12px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.plan .selbar .btn { padding: 2px 10px; font-size: 12px; flex: none; }
.plan .pill { fill: #0a1222; fill-opacity: .92; stroke-width: .18; }
.plan .pt { text-anchor: middle; font-weight: 600; pointer-events: none; }
.plan svg.only-top .blk.bottom, .plan svg.only-bottom .blk.top { opacity: .12; pointer-events: none; }
.plan svg.only-top .keepout:not([data-sides~="top"]), .plan svg.only-bottom .keepout:not([data-sides~="bottom"]) { display: none; }
.plan svg.dim .blk:not(.hot):not(.sel) { opacity: .35; }
.plan svg.dim .link, .plan svg.dim .pill-g { opacity: .5; }
.plan .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 7px 12px 0; font-size: 11px; color: var(--muted); }
.plan .legend i { display: inline-block; width: 14px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; border: 1.5px solid var(--muted); }
.plan .legend i.b { border-style: dashed; background: repeating-linear-gradient(45deg, transparent 0 2px, color-mix(in srgb, var(--muted) 45%, transparent) 2px 3px); }
.plan .legend i.g { border: 0; height: 3px; border-radius: 2px; background: #e0a800; width: 16px; vertical-align: 2px; }
.plan .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; padding: 8px 10px 4px; }
.plan .row { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 7px; cursor: pointer; min-width: 0; }
.plan .row:hover, .plan .row.hot { background: var(--surface-2); }
.plan .row.sel { background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
.plan .row .dot { flex: none; width: 9px; height: 9px; border-radius: 3px; }
.plan .row .dot.b { background: transparent !important; border: 1.5px dashed; }
.plan .row .n { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan .row .c { margin-left: auto; flex: none; font-size: 10.5px; color: var(--muted); }
.plan .row .s { flex: none; font-size: 9.5px; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.plan .notes { margin: 4px 10px 0; padding: 0 0 0 16px; font-size: 12px; color: var(--text); }
.plan .notes li { margin: 2px 0; }
.plan .hint { font-size: 11px; color: var(--muted); padding: 6px 12px 10px; }
.plan .err { font-size: 11.5px; color: var(--warn); padding: 0 10px 8px; }
@media (max-width: 380px) { .plan .rows { grid-template-columns: 1fr; } }
.typing { padding: 4px 2px 12px; }
.typing .row { display: flex; align-items: center; gap: 4px; }
.typing span { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
.typing .status { margin-left: 6px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.typing.quiet .status { color: var(--warn); }
/* Claude's thinking: live while it thinks, then kept as a collapsed row */
.typing .thought-live {
  margin: 6px 0 0 2px; padding-left: 9px; border-left: 2px solid var(--border);
  font-size: 12px; line-height: 1.45; color: var(--muted); font-style: italic;
  max-height: 5.8em; overflow: hidden; white-space: pre-wrap;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.typing .thought-live:empty { display: none; }
details.thought { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
details.thought summary { cursor: pointer; list-style: none; user-select: none; }
details.thought summary::before { content: '▸ '; }
details.thought[open] summary::before { content: '▾ '; }
details.thought .body { margin: 6px 0 0 2px; padding-left: 9px; border-left: 2px solid var(--border); font-style: italic; }
details.thought .body p { margin: 0 0 6px; }

/* empty state */
#empty { margin: auto 0; padding: 24px 6px; text-align: center; color: var(--muted); }
#empty .big { font-size: 15px; color: var(--text); font-weight: 600; margin: 10px 0 4px; }
.chips { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; text-align: left; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 11px;
  font-size: 12.5px; text-align: left; transition: border-color .15s, transform .15s;
}
.chip:hover { border-color: var(--accent); transform: translateY(-1px); }

/* composer */
footer { padding: 8px 12px 12px; }
.context { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; min-height: 0; }
.ctx {
  font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 999px;
  padding: 1px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.composer {
  display: flex; align-items: flex-end; gap: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: var(--shadow);
  transition: border-color .15s;
}
.composer:focus-within { border-color: var(--accent); }
textarea {
  flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
  font: inherit; max-height: 140px; padding: 4px 0; line-height: 1.45;
}
textarea::placeholder { color: var(--muted); }
#send {
  width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; flex: none; transition: opacity .15s;
}
#send:disabled { opacity: .35; cursor: default; }
.attach-btn {
  width: 30px; height: 30px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
  display: grid; place-items: center; flex: none;
}
.attach-btn:hover { background: var(--surface-2); color: var(--text); }
.attach-btn svg { width: 16px; height: 16px; }
.files-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.files-row:empty { display: none; }
.file-chip {
  display: flex; align-items: center; gap: 2px; max-width: 100%; font-size: 11px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 2px 1px 8px;
}
.file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip button { border: 0; background: transparent; color: var(--muted); padding: 0 5px; font-size: 12px; line-height: 1; }
.file-chip button:hover { color: var(--err); }
.user > div { max-width: 88%; display: flex; flex-direction: column; align-items: flex-end; }
.user > div .bubble { max-width: 100%; }
.user .att { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }
body.dragging .composer { border-color: var(--accent); border-style: dashed; }
#send svg { width: 16px; height: 16px; }
.hint {
  font-size: 10.5px; color: var(--muted); min-width: 0; text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.below { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; }
.picker { position: relative; flex: none; }
.model-btn {
  display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 999px; padding: 2px 8px 2px 10px; font-size: 11.5px; color: var(--muted);
  white-space: nowrap; transition: color .15s, border-color .15s;
}
.model-btn:hover, .model-btn.open { color: var(--text); border-color: var(--accent); }
.model-btn svg { width: 12px; height: 12px; }
.model-menu {
  position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 220px; z-index: 10;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); padding: 4px; display: none; animation: rise .12s ease-out;
}
.model-menu.open { display: block; }
.model-opt {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  border-radius: 8px; padding: 6px 10px;
}
.model-opt:hover { background: var(--surface-2); }
.model-opt .n { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 500; }
.model-opt .d { font-size: 11px; color: var(--muted); }
.model-opt.sel .n::after { content: "✓"; color: var(--accent); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
</style>
</head>

<script>
const ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
const ICON_BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

const $ = id => document.getElementById(id);
const log = $('log'), input = $('input'), send = $('send');
let busy = false, toolGroup = null, typing = null;

function post(msg) { window.wx && window.wx.postMessage(JSON.stringify(msg)); }

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(kicad:([^)\s]+)\)/g, '<a class="loc" data-loc="$2" title="Show in KiCad">$1</a>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
}

function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = [], indent = line.match(/^\s*/)[0].length;
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) buf.push(lines[i].slice(Math.min(indent, lines[i].match(/^\s*/)[0].length)));
      i++;
      html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`;
    } else if (/^#{1,6}\s/.test(line)) {
      const n = Math.min(line.match(/^#+/)[0].length, 3);
      html += `<h${n}>${inline(line.replace(/^#+\s*/, ''))}</h${n}>`; i++;
    } else if (/^\s*([-*]|\d+\.)\s/.test(line)) {
      const ordered = /^\s*\d+\./.test(line), tag = ordered ? 'ol' : 'ul';
      html += `<${tag}>`;
      while (i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i]))
        html += `<li>${inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s/, ''))}</li>`;
      html += `</${tag}>`;
    } else if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      html += '<table><tr>' + cells(line).map(c => `<th>${c}</th>`).join('') + '</tr>';
      for (i += 2; i < lines.length && /^\|.*\|\s*$/.test(lines[i]); i++)
        html += '<tr>' + cells(lines[i]).map(c => `<td>${c}</td>`).join('') + '</tr>';
      html += '</table>';
    } else if (!line.trim()) {
      i++;
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(\s*```|#{1,6}\s|\s*([-*]|\d+\.)\s|\|)/.test(lines[i])) buf.push(lines[i++]);
      if (!buf.length) buf.push(lines[i++]);
      html += `<p>${buf.map(inline).join('<br>')}</p>`;
    }
  }
  return html;
}

function add(el) {
  $('empty') && $('empty').remove();
  if (typing) log.insertBefore(el, typing); else log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// The block plan (powerlab-placement). The panel builds the drawing and escapes all of its
// text. A click on a block (or its row) selects that block's parts in KiCad; a drag moves
// the block, and the panel writes the move into the plan file and redraws the card.
// The user's moves reach Claude when they press "Send moves to Claude".
function planCard(e, state) {
  state = state || { view: 'both', moves: [], pending: null };
  const card = div('plan');
  card.dataset.path = e.path || '';
  card._state = state;
  const head = div('head');
  const words = div('');
  words.append(div('t', esc(e.title || 'Block plan')));
  const sides = new Set((e.blocks || []).map(b => b.side));
  words.append(div('v', `${(e.blocks || []).length} blocks · click to select in KiCad · drag to move`));
  head.append(words);
  card.append(head);
  if (e.error) { card.append(div('err', esc(e.error))); return card; }
  const canvas = div('canvas', e.svg || '');
  const svg = canvas.querySelector('svg');
  card.append(canvas);
  const setView = k => {
    state.view = k;
    if (!svg) return;
    svg.classList.toggle('only-top', k === 'top');
    svg.classList.toggle('only-bottom', k === 'bottom');
  };
  if (sides.size > 1 && svg) {
    const seg = div('seg');
    [['both', 'Both'], ['top', 'Top'], ['bottom', 'Bottom']].forEach(([k, label]) => {
      const b = document.createElement('button');
      b.textContent = label; b.className = k === state.view ? 'on' : '';
      b.onclick = () => { seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); setView(k); };
      seg.append(b);
    });
    head.append(seg);
  }
  setView(state.view);
  const sendMove = (move, undo) => {
    if (!undo) state.pending = move;
    post({ type: 'plan_move', path: e.path, moves: [move], undo: !!undo });
  };
  const legend = div('legend');
  legend.innerHTML = '<span><i></i>top side</span><span><i class="b"></i>bottom side</span>' +
    ((e.links || []).some(l => l.kind === 'gate') ? '<span><i class="g"></i>gate drive</span>' : '');
  card.append(legend);
  const rows = div('rows');
  const parts = {};  // block id -> [svg group, list row]
  (svg ? svg.querySelectorAll('g.blk') : []).forEach(g => { parts[g.dataset.id] = [g, null]; });
  (e.blocks || []).forEach(b => {
    const r = div('row');
    const dot = div('dot' + (b.side === 'bottom' ? ' b' : ''));
    dot.style.background = b.colour; dot.style.borderColor = b.colour;
    const n = div('n'); n.textContent = b.name; n.title = b.detail || b.name;
    const s = document.createElement('button');
    s.className = 's'; s.textContent = b.side === 'bottom' ? 'BOT' : 'TOP';
    s.title = `Move ${b.name} to the ${b.side === 'bottom' ? 'top' : 'bottom'} side`;
    s.onclick = ev => {
      ev.stopPropagation();
      sendMove({ id: b.id, side: b.side === 'bottom' ? 'top' : 'bottom', prev: b.side });
    };
    const c = div('c'); c.textContent = b.count ? `${b.count} part${b.count > 1 ? 's' : ''}` : '';
    r.append(dot, n, s, c);
    rows.append(r);
    (parts[b.id] = parts[b.id] || [null, null])[1] = r;
    r.dataset.loc = b.loc || '';
  });
  const hot = (id, on) => {
    const [g, r] = parts[id] || [];
    if (g) g.classList.toggle('hot', on);
    if (r) r.classList.toggle('hot', on);
    if (svg) svg.classList.toggle('dim', on && !!g);
  };
  // The selected block's bar: its name, side and the button that moves it to the other side.
  const selbar = div('selbar');
  canvas.after(selbar);
  const showSel = id => {
    Object.entries(parts).forEach(([k, [g, r]]) => {
      if (g) g.classList.toggle('sel', k === id);
      if (r) r.classList.toggle('sel', k === id);
    });
    selbar.textContent = '';
    const b = (e.blocks || []).find(x => x.id === id);
    selbar.classList.toggle('open', !!b);
    if (!b) return;
    const other = b.side === 'bottom' ? 'top' : 'bottom';
    const dot = div('dot' + (b.side === 'bottom' ? ' b' : ''));
    dot.style.background = b.colour; dot.style.borderColor = b.colour;
    const n = div('n'); n.textContent = b.name;
    const where = div('w'); where.textContent = `${b.side} side` + (b.count ? ` · ${b.count} parts` : '');
    const flip = document.createElement('button');
    flip.className = 'btn'; flip.textContent = other === 'bottom' ? 'Move to bottom side ↓' : 'Move to top side ↑';
    flip.onclick = () => sendMove({ id: b.id, side: other, prev: b.side });
    selbar.append(dot, n, where, flip);
    const g = parts[id] && parts[id][0];
    if (g && g.dataset.turn) {
      // Boxes and polygons turn: 90° and 45° first (§3.2), then any angle typed in.
      const rot = div('rot');
      const lab = document.createElement('span'); lab.textContent = 'Rotate';
      rot.append(lab);
      [[90, '↻ 90°'], [45, '↻ 45°'], [-45, '↺ 45°']].forEach(([a, label]) => {
        const bt = document.createElement('button');
        bt.className = 'btn'; bt.textContent = label;
        bt.title = `Turn ${b.name} ${Math.abs(a)}° ${a > 0 ? 'clockwise' : 'counter-clockwise'}`;
        bt.onclick = () => sendMove({ id: b.id, rot: a });
        rot.append(bt);
      });
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = '-360'; inp.max = '360'; inp.step = '0.5'; inp.placeholder = 'any °';
      inp.title = 'Any angle in degrees: positive turns clockwise, negative counter-clockwise';
      const go = document.createElement('button');
      go.className = 'btn'; go.textContent = 'Turn';
      go.onclick = () => {
        const a = parseFloat(inp.value);
        if (isFinite(a) && a && Math.abs(a) <= 360) sendMove({ id: b.id, rot: a });
        else inp.focus();
      };
      inp.addEventListener('keydown', k => { if (k.key === 'Enter') go.click(); });
      rot.append(inp, go);
      selbar.append(rot);
    }
  };
  const pick = id => {
    state.sel = id;
    showSel(id);
    const [g, r] = parts[id] || [];
    const loc = (g && g.dataset.loc) || (r && r.dataset.loc);
    if (loc) post({ type: 'locate', target: loc });
  };
  if (state.sel) showSel(state.sel);
  const toSvg = ev => {
    const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  };
  const half = v => Math.round(v * 2) / 2;  // drags snap to 0.5 mm / 0.5 degree
  // The links of a dragged block follow it, with the gap to the other block measured live
  // (edge to edge, like the panel measures it after the drop).
  const ptsOf = g => g._pts || (g._pts = (g.dataset.pts || '').split(' ').filter(Boolean).map(s => s.split(',').map(Number)));
  const inside = (p, poly) => {
    let hit = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [x0, y0] = poly[i], [x1, y1] = poly[j];
      if ((y0 > p[1]) !== (y1 > p[1]) && p[0] < (x1 - x0) * (p[1] - y0) / (y1 - y0) + x0) hit = !hit;
    }
    return hit;
  };
  const gapOf = (a, b) => {
    if (!a.length || !b.length) return null;
    if (a.some(p => inside(p, b)) || b.some(p => inside(p, a))) return 0;
    let m = Infinity;
    for (const p of a) for (const q of b) { const d = (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2; if (d < m) m = d; }
    return Math.sqrt(m);
  };
  const baseLabel = t => t.replace(/\s*·\s*(overlap|stacked|[\d.]+ mm gap)$/, '').replace(/[\s·:]*[~≈]?\s*\d+(\.\d+)?\s*(mm)?(\s*gap)?\s*$/, '');
  const follow = (id, tf) => {
    if (!svg) return;
    const g = parts[id] && parts[id][0];
    const moved = ptsOf(g).map(tf);
    const anchor = tf([+g.dataset.ax, +g.dataset.ay]);
    svg.querySelectorAll('line.link').forEach(line => {
      const from = line.dataset.from, to = line.dataset.to;
      if (from !== id && to !== id) return;
      const other = parts[from === id ? to : from];
      if (!other || !other[0]) return;
      const og = other[0];
      if (from === id) { line.setAttribute('x1', anchor[0]); line.setAttribute('y1', anchor[1]); }
      else { line.setAttribute('x2', anchor[0]); line.setAttribute('y2', anchor[1]); }
      const pill = svg.querySelector(`g.pill-g[data-i="${line.dataset.i}"]`);
      if (!pill) return;
      const gap = gapOf(moved, ptsOf(og));
      const base = baseLabel(pill.dataset.label || '');
      const text = pill.querySelector('text'), rect = pill.querySelector('rect');
      const stacked = g.dataset.side !== og.dataset.side;  // over each other on the two sides
      text.textContent = (base ? base + ' · ' : '') +
        (gap === 0 ? (stacked ? 'stacked' : 'overlap') : `${gap.toFixed(1)} mm gap`);
      pill.classList.remove('empty'); pill.classList.add('live');
      const x1 = +line.getAttribute('x1'), y1 = +line.getAttribute('y1');
      const x2 = +line.getAttribute('x2'), y2 = +line.getAttribute('y2');
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, w = text.getComputedTextLength() + 1.4;
      text.setAttribute('x', mx); text.setAttribute('y', my + 0.52);
      rect.setAttribute('x', mx - w / 2); rect.setAttribute('y', my - 1.13); rect.setAttribute('width', w);
    });
  };
  Object.entries(parts).forEach(([id, [g, r]]) => {
    [g, r].forEach(el => {
      if (!el) return;
      el.addEventListener('mouseenter', () => hot(id, true));
      el.addEventListener('mouseleave', () => hot(id, false));
      el.addEventListener('click', () => {
        if (el.dataset.dragged) { delete el.dataset.dragged; return; }
        pick(id);
      });
      el.addEventListener('keydown', k => { if (k.key === 'Enter') pick(id); });
    });
    if (!g) return;
    g.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      const p0 = toSvg(ev);
      const sector = g.dataset.drag === 'sector';
      const cx = +g.dataset.cx, cy = +g.dataset.cy, ax = +g.dataset.ax, ay = +g.dataset.ay;
      let move = null;
      try { g.setPointerCapture(ev.pointerId); } catch (_) { /* still drags while over the block */ }
      const onMove = ev2 => {
        const p = toSvg(ev2);
        let tf;  // where a point of the block is now
        if (sector) {
          let da = (Math.atan2(p.y - cy, p.x - cx) - Math.atan2(p0.y - cy, p0.x - cx)) * 180 / Math.PI;
          da = half(((da + 540) % 360) - 180);
          const dr = half(Math.hypot(p.x - cx, p.y - cy) - Math.hypot(p0.x - cx, p0.y - cy));
          const am = Math.atan2(ay - cy, ax - cx);
          const tx = dr * Math.cos(am), ty = dr * Math.sin(am), t = da * Math.PI / 180;
          g.setAttribute('transform', `rotate(${da} ${cx} ${cy}) translate(${tx} ${ty})`);
          tf = ([x, y]) => {
            const ux = x + tx - cx, uy = y + ty - cy;
            return [cx + ux * Math.cos(t) - uy * Math.sin(t), cy + ux * Math.sin(t) + uy * Math.cos(t)];
          };
          move = (da || dr) ? { id, da, dr } : null;
        } else {
          const dx = half(p.x - p0.x), dy = half(p.y - p0.y);
          g.setAttribute('transform', `translate(${dx} ${dy})`);
          tf = ([x, y]) => [x + dx, y + dy];
          move = (dx || dy) ? { id, dx, dy } : null;
        }
        g.classList.toggle('drag', !!move);
        follow(id, tf);
      };
      const onUp = () => {
        g.removeEventListener('pointermove', onMove);
        g.removeEventListener('pointerup', onUp);
        g.removeEventListener('pointercancel', onUp);
        if (move) { g.dataset.dragged = '1'; sendMove(move); }
        else g.removeAttribute('transform');
      };
      g.addEventListener('pointermove', onMove);
      g.addEventListener('pointerup', onUp);
      g.addEventListener('pointercancel', onUp);
    });
  });
  card.append(rows);
  if (state.moves.length) {
    const bar = div('moves');
    bar.append(div('mt', `Your moves (${state.moves.length})`));
    const ul = document.createElement('ul');
    state.moves.forEach(m => m.lines.forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.append(li); }));
    bar.append(ul);
    const btns = div('mb');
    const undo = document.createElement('button');
    undo.className = 'btn'; undo.textContent = 'Undo';
    undo.onclick = () => {
      const last = state.moves.pop();
      if (!last) return;
      const m = last.move;
      const back = m.side ? { id: m.id, side: m.prev } : m.rot ? { id: m.id, rot: -m.rot }
        : 'da' in m ? { id: m.id, da: -m.da, dr: -m.dr } : { id: m.id, dx: -m.dx, dy: -m.dy };
      sendMove(back, true);
    };
    const go = document.createElement('button');
    go.className = 'btn primary'; go.textContent = 'Send moves to Claude';
    go.disabled = busy; go.title = busy ? 'Claude is still working' : '';
    go.onclick = () => {
      if (busy) return;
      const lines = state.moves.flatMap(m => m.lines);
      post({ type: 'send', text: 'I moved blocks on the block plan card, and placement\\block-plan.json ' +
        'now has them:\n' + lines.map(t => '- ' + t).join('\n') + '\nRead the plan again with these moves: ' +
        'measure the links again, check them against the rules, update the plan and tell me what you think.' });
      state.moves = [];
      bar.remove();
    };
    btns.append(undo, go);
    bar.append(btns);
    card.append(bar);
  }
  if ((e.notes || []).length) {
    const ul = document.createElement('ul'); ul.className = 'notes';
    e.notes.forEach(t => { const li = document.createElement('li'); li.innerHTML = inline(t); ul.append(li); });
    card.append(ul);
  }
  card.append(div('hint', 'Hover a block to see it, click to select its parts in KiCad, drag to move it, ' +
    'or click TOP/BOT to switch its side.'));
  return card;
}

function div(cls, html) { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; return d; }

function setBusy(v) {
  busy = v;
  document.body.classList.toggle('busy', v);
  $('header').classList.toggle('busy', v);
  $('status').textContent = v ? 'Working…' : 'Ready';
  send.innerHTML = v ? ICON_STOP : ICON_SEND;
  send.title = v ? 'Stop' : 'Send (Enter)';
  updateSend();
  if (v && !typing) {
    typing = div('typing', '<div class="row"><span></span><span></span><span></span><div class="status"></div></div>'
      + '<div class="thought-live"></div>');
    log.appendChild(typing); log.scrollTop = log.scrollHeight;
    setActivity('waiting', '');
  } else if (!v && typing) { typing.remove(); typing = null; activity = null; }
}

// What Claude is doing, with a timer: a long think shows no messages and looked like a hang.
const ACTIVITY = {
  waiting: 'Waiting for Claude', thinking: 'Thinking', writing: 'Writing', preparing: 'Preparing',
  tool: 'Running', retry: "Claude's servers are busy, retrying",
};
const LIVE_THOUGHT_CHARS = 1500;  // as in panel.py
const QUIET_MS = 5 * 60 * 1000;  // no sign of Claude for this long (outside a tool): suggest Stop
let activity = null;
function setActivity(phase, name, tokens, thought) {
  const now = Date.now();
  if (!activity || activity.phase !== phase || activity.name !== name) activity = { phase, name, since: now };
  activity.alive = now;
  activity.tokens = tokens || 0;
  if (typing) {
    const live = typing.querySelector('.thought-live');
    // The panel sends only the end of a long thought; start that at a sentence, not mid-word.
    const cut = thought && thought.length >= LIVE_THOUGHT_CHARS;
    const text = !thought ? '' : cut ? '…' + thought.replace(/^[^]*?[.!?\n]\s*/, '') : thought;
    if (live.textContent !== text) { live.textContent = text; log.scrollTop = log.scrollHeight; }
  }
  showActivity();
}
function clock(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function showActivity() {
  if (!typing || !activity) return;
  const now = Date.now(), quietMs = now - activity.alive;
  const quiet = activity.phase !== 'tool' && quietMs >= QUIET_MS;
  typing.classList.toggle('quiet', quiet);
  typing.querySelector('.status').textContent = quiet
    ? `Nothing from Claude for ${Math.floor(quietMs / 60000)} min. If it stays quiet, press Stop, then send “continue”.`
    : `${ACTIVITY[activity.phase] || 'Working'}${activity.name ? ' ' + activity.name : ''} · ${clock(now - activity.since)}`
      + (activity.tokens ? ` · ${activity.tokens.toLocaleString('en-US')} tokens` : '');
}
setInterval(showActivity, 1000);

let attachedCount = 0;
function updateSend() { send.disabled = !busy && !input.value.trim() && !attachedCount; }

function renderFiles(names) {
  const row = $('files'); row.innerHTML = '';
  attachedCount = names.length;
  names.forEach((name, index) => {
    const chip = div('file-chip');
    const label = document.createElement('span'); label.textContent = '📎 ' + name; label.title = name;
    const x = document.createElement('button'); x.textContent = '×'; x.title = 'Remove';
    x.onclick = () => post({ type: 'attach_remove', index });
    chip.append(label, x); row.appendChild(chip);
  });
  updateSend();
}

const MAX_ATTACH = 20 * 1024 * 1024;
function attachFile(file) {
  if (file.size > MAX_ATTACH) {
    app.event({ kind: 'note', level: 'warn', text: `${file.name} is larger than 20 MB, so it wasn't attached.` });
    return;
  }
  const reader = new FileReader();
  reader.onload = () => post({ type: 'attach_data', name: file.name || 'pasted.png', data: reader.result });
  reader.readAsDataURL(file);
}

const app = {
  event(e) {
    switch (e.kind) {
      case 'user': {
        toolGroup = null;
        closeChoices();
        const files = (e.files || []).length ? `<div class="att">📎 ${esc(e.files.join(', '))}</div>` : '';
        add(div('msg user', `<div><div class="bubble">${esc(e.text)}</div>${files}</div>`)); break;
      }
      case 'attachments': renderFiles(e.items || []); break;
      case 'usage': {
        const h = $('hint');
        if (e.text) { h.textContent = e.text; h.title = e.tip || e.text; }
        break;
      }
      case 'text':
        toolGroup = null;
        if (e.text) add(div('msg assistant', markdown(e.text)));
        if ((e.choices || []).length) add(choicesCard(e.choices));
        break;
      case 'tool': {
        if (!toolGroup) toolGroup = add(div('tools'));
        const row = div('tool', `<span class="ti run"></span><span class="name">${esc(e.name)}</span><span class="detail">${esc(e.detail || '')}</span>`);
        row.id = 'tool-' + e.id; row.title = e.detail || '';
        toolGroup.appendChild(row); log.scrollTop = log.scrollHeight; break;
      }
      case 'tool_done': {
        const row = document.getElementById('tool-' + e.id);
        if (!row) break;
        const ti = row.querySelector('.ti');
        ti.className = 'ti ' + (e.error ? 'bad' : 'ok');
        ti.innerHTML = e.error ? ICON_BAD : ICON_OK;
        if (e.error && e.text) row.after(div('err-text', esc(e.text)));
        break;
      }
      case 'note': {
        const n = add(div('note ' + (e.level || 'info'), `<span>${esc(e.text)}</span>`));
        if (e.action) {
          const b = document.createElement('button');
          b.textContent = e.action.label; b.onclick = () => post({ type: e.action.type, id: e.action.id });
          n.appendChild(b);
        }
        toolGroup = null; break;
      }
      case 'meta': add(div('meta', esc(e.text))); toolGroup = null; break;
      case 'image': {
        const fig = div('shot');
        const img = document.createElement('img');
        img.src = e.src; img.alt = e.name; img.title = 'Open ' + e.name;
        img.onload = () => { log.scrollTop = log.scrollHeight; };
        img.onclick = () => post({ type: 'open', path: e.path });
        const cap = div('cap'); cap.textContent = e.name;
        fig.append(img, cap);
        add(fig); toolGroup = null; break;
      }
      case 'review': {
        // The panel builds the body from the review file and escapes all of its text.
        const card = div('review');
        const head = div('head');
        const words = div('');
        words.append(div('t', esc(e.title || 'Design review')));
        if (e.verdict) words.append(div('v', esc(e.verdict)));
        head.append(words);
        const file = e.pdf || e.html;
        if (file) {
          const b = document.createElement('button');
          b.className = 'btn primary'; b.textContent = e.pdf ? 'Open PDF' : 'Open in browser';
          b.title = file; b.onclick = () => post({ type: 'open', path: file });
          head.append(b);
        }
        card.append(head);
        if (e.error) card.append(div('err', esc(e.error)));
        const d = document.createElement('details');
        d.open = true;
        const s = document.createElement('summary'); s.textContent = 'Full review';
        const body = div('body assistant', e.body || '');
        body.querySelectorAll('img[data-path]').forEach(img => {
          img.onclick = () => post({ type: 'open', path: img.dataset.path });
        });
        d.append(s, body); card.append(d);
        add(card); toolGroup = null;
        log.scrollTop = card.offsetTop - log.offsetTop - 8;  // a long review is read from its top
        break;
      }
      case 'plan': add(planCard(e)); toolGroup = null; break;
      case 'plan_update': {
        // A drag was written into the plan file: redraw the newest card of that plan.
        const old = [...document.querySelectorAll('.plan')].filter(c => c.dataset.path === e.path).pop();
        if (!old) break;
        const st = old._state;
        if (!e.undo) {  // an undo's answer leaves a move still on its way alone
          if (st.pending && (e.lines || []).length) st.moves.push({ move: st.pending, lines: e.lines });
          st.pending = null;
        }
        old.replaceWith(planCard(e, st));
        break;
      }
      case 'busy':
        setBusy(e.value);
        if (!e.value) {
          toolGroup = null;
          document.querySelectorAll('.ti.run').forEach(t => { t.className = 'ti'; t.textContent = '·'; });
        }
        break;
      case 'activity': if (typing) setActivity(e.phase, e.name || '', e.tokens, e.thought); break;
      case 'thought': {
        const d = document.createElement('details');
        d.className = 'thought';
        const s = document.createElement('summary');
        s.textContent = e.secs >= 1 ? `Thought for ${clock(e.secs * 1000)}` : 'Thought';
        d.append(s, div('body', markdown(e.text)));
        add(d); toolGroup = null; break;
      }
      case 'session': break;
      case 'context': {
        const c = $('context'); c.innerHTML = '';
        for (const t of e.items) { const s = div('ctx'); s.textContent = t; s.title = t; c.appendChild(s); }
        break;
      }
      case 'notice': showNotice(); break;
      case 'report_sheet': showReport(e); break;
      case 'gh_status':
        if (reportState) { reportState.gh = e.ok; renderReportGh(); }
        break;
      case 'share_sheet': showShare(e); break;
      case 'library': renderLibrary(e); break;
      case 'update': renderUpdate(e); break;
      case 'models': models = e.items; currentModel = e.current; renderModels(); break;
      case 'model': currentModel = e.current; renderModels(); break;
      case 'suggestions': {
        const box = document.querySelector('.chips');
        if (!box) break;
        box.innerHTML = '';
        for (const s of e.items) {
          const b = document.createElement('button');
          b.className = 'chip'; b.dataset.text = s.text; b.textContent = s.label;
          wireChip(b); box.appendChild(b);
        }
        break;
      }
    }
  }
};

// Claude's <choices>: every question gets Claude's options plus "Other…", which opens a
// text box in the card for the user's own answer. One click on an option answers a single
// question; several questions, or a written answer, go together with "Send answers".
// Typing a message in the chat box instead answers too.
const RECOMMENDED = /\s*\(recommended\)\s*$/i;
const OTHER = /^other\b/i;  // the card has its own Other…, so Claude's is dropped
function closeChoices() {
  document.querySelectorAll('.choices:not(.done)').forEach(c => {
    c.classList.add('done');
    c.querySelectorAll('button, input').forEach(b => { b.disabled = true; });
  });
}
function choicesCard(questions) {
  const card = div('choices'), answers = questions.map(() => () => null);
  const single = questions.length === 1;
  const sendBtn = button(single ? 'Send' : 'Send answers', 'primary', () => answer());
  const ready = () => answers.every(a => a());
  const refresh = () => { sendBtn.disabled = !ready(); };
  function answer() {
    if (busy || !ready()) return;
    const picked = answers.map(a => a());
    const text = single ? picked[0]
      : questions.map((q, i) => `${q.question} → ${picked[i]}`).join('\n');
    post({ type: 'send', text });
    closeChoices();
  }
  questions.forEach((q, qi) => {
    card.appendChild(div('q')).textContent = q.question;
    const opts = card.appendChild(div('opts'));
    const other = document.createElement('input');
    other.className = 'other-in'; other.placeholder = 'Your answer…';
    const select = b => opts.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
    q.options.filter(o => !OTHER.test(o)).forEach(o => {
      const label = o.replace(RECOMMENDED, ''), rec = RECOMMENDED.test(o);
      const b = document.createElement('button');
      b.className = 'opt' + (rec ? ' rec' : '');
      b.textContent = label;
      if (rec) b.appendChild(div('tag')).textContent = ' · Recommended';
      b.onclick = () => {
        if (busy) return;
        select(b); other.classList.remove('open');
        answers[qi] = () => label;
        if (single) answer(); else refresh();
      };
      opts.appendChild(b);
    });
    const ob = document.createElement('button');
    ob.className = 'opt other'; ob.textContent = 'Other…';
    ob.onclick = () => {
      if (busy) return;
      select(ob); other.classList.add('open'); other.focus();
      answers[qi] = () => other.value.trim() || null;
      if (single) sendBtn.hidden = false;
      refresh();
    };
    opts.appendChild(ob);
    other.oninput = refresh;
    other.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); answer(); } };
    card.appendChild(other);
  });
  const foot = card.appendChild(div('foot'));
  foot.appendChild(document.createElement('span')).textContent = 'Other… lets you write your own answer.';
  sendBtn.disabled = true;
  sendBtn.hidden = single;  // a single question sends on click, or here after Other…
  foot.appendChild(sendBtn);
  return card;
}
function submit() {
  if (busy) { post({ type: 'stop' }); return; }
  const text = input.value.trim();
  if (!text && !attachedCount) return;
  post({ type: 'send', text });
  input.value = ''; autosize(); updateSend();
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }

input.addEventListener('input', () => { autosize(); updateSend(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
send.addEventListener('click', submit);
// A place on the board, in a review or a reply: select it and zoom to it in KiCad.
log.addEventListener('click', e => {
  const loc = e.target.closest && e.target.closest('a.loc');
  if (loc) { e.preventDefault(); post({ type: 'locate', target: loc.dataset.loc }); }
});
$('attach').addEventListener('click', () => post({ type: 'attach' }));
input.addEventListener('paste', e => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (files.length) { e.preventDefault(); files.forEach(attachFile); }
});
// Dropping a file must never navigate the panel away, so handle every drop here.
let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  [...((e.dataTransfer && e.dataTransfer.files) || [])].forEach(attachFile);
});
// ---- sheets: notice, problem report, library sharing ----
const overlay = $('overlay'), sheet = $('sheet');
let reportState = null, sheetLocked = false;

function openSheet(html, locked = false) {

}
function closeSheet() {

}
function button(label, cls, onclick) {
  const b = document.createElement('button');

  return b;
}
overlay.addEventListener('click', e => { if (e.target === overlay && !sheetLocked) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheetLocked && overlay.classList.contains('open')) closeSheet(); });

      <li><b>Your data goes to Anthropic.</b> Your messages and the project files Claude reads are processed by Anthropic under your own Claude account and its terms.</li>

function showReport(e) {

function renderReportGh() {

  if (!gh) {

    ${checkHtml}
    <label>Title<input type="text" id="s-title"></label>
    <label>Description <span class="muted">— parts, datasheets, anything reviewers should know</span><textarea id="s-desc" rows="3"></textarea></label>
    ${e.login ? `<p class="small">Signed in to GitHub as <b>${esc(e.login)}</b>.</p>`
              : '<p class="tip">Connect your GitHub account to open pull requests. <button class="link" id="s-connect">Connect GitHub</button> · <button class="link" id="s-check">Check again</button></p>'}
    <div class="actions" id="s-actions"></div>`);
  $('s-title').value = 'Add ' + (libs.length ? libs.slice(0, 3).join(', ') : 'library parts');
  if (!e.login) {
    $('s-connect').onclick = () => post({ type: 'gh_connect' });
    $('s-check').onclick = () => post({ type: 'lib_share' });
  }
  const acts = $('s-actions');
  const submit = button('Open pull request', 'primary', () => {
    const paths = [...sheet.querySelectorAll('.files input:checked')].map(c => files[+c.dataset.i].path);
    post({ type: 'share_submit', paths, login: e.login, title: $('s-title').value, description: $('s-desc').value });
    closeSheet();
  });
  submit.disabled = !e.login || (check && !check.passed);
  acts.append(button('Cancel', '', closeSheet), submit);
}

function renderUpdate(e) {
  const bar = $('updbar');
  bar.innerHTML = '';
  const span = document.createElement('span'); span.className = 'msg';
  span.textContent = `PowerLab Assistant ${e.version} is available` + (e.summary ? `: ${e.summary}` : '.');
  span.title = `${span.textContent} (you have ${e.current})`;
  bar.append(span,
    button('What\'s new', '', () => post({ type: 'whats_new', url: e.url })),
    button('Update', '', () => { post({ type: 'plugin_update', url: e.url }); span.textContent = 'Updating… restart KiCad when the console says done.'; }));
  bar.classList.add('show');
}

function renderLibrary(e) {
  const bar = $('libbar');
  bar.className = 'libbar'; bar.innerHTML = '';
  if (!e.configured) return;
  const parts = [];
  if (!e.vars_ok) parts.push(['KiCad\'s METUPOWERLAB paths don\'t point to your library copy. Run install.ps1 again.', null, true]);
  if (e.behind) parts.push([`Library update available (${e.behind} new change${e.behind > 1 ? 's' : ''}).`, ['Update', 'lib_update']]);
  else if (!e.ok && e.error) parts.push([`Library: ${e.error}.`, null]);
  if (e.changes && e.changes.length) parts.push([`${e.changes.length} library change${e.changes.length > 1 ? 's' : ''} not shared yet.`, ['Share', 'lib_share']]);
  if (!parts.length) return;
  const [msg, action, warn] = parts[0];
  const span = document.createElement('span'); span.className = 'msg'; span.textContent = msg; span.title = parts.map(p => p[0]).join(' ');
  bar.append(span);
  for (const [, act] of parts) {
    if (act) bar.append(button(act[0], '', b => { post({ type: act[1] }); if (act[1] === 'lib_update') { span.textContent = 'Updating the library…'; } }));
  }
  bar.classList.add('show'); if (warn) bar.classList.add('warn');
}

const CHEVRON ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>';
let models = [], currentModel = '';
const modelBtn = $('model-btn'), modelMenu = $('model-menu');

function renderModels() {
  if (!models.length) { modelBtn.style.display = 'none'; return; }
  const cur = models.find(m => m.id === currentModel) || models[0];
  modelBtn.style.display = '';
  modelBtn.innerHTML = esc(cur.short || cur.label) + CHEVRON;
  modelMenu.innerHTML = '';
  for (const m of models) {
    const b = document.createElement('button');
    b.className = 'model-opt' + (m.id === cur.id ? ' sel' : '');
    b.innerHTML = `<div class="n">${esc(m.label)}</div>` + (m.hint ? `<div class="d">${esc(m.hint)}</div>` : '');
    b.onclick = () => { post({ type: 'model', id: m.id }); closeModels(); input.focus(); };
    modelMenu.appendChild(b);
  }
}
function closeModels() { modelMenu.classList.remove('open'); modelBtn.classList.remove('open'); }
modelBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = !modelMenu.classList.contains('open');
  modelMenu.classList.toggle('open', open); modelBtn.classList.toggle('open', open);
});
document.addEventListener('click', e => { if (!modelMenu.contains(e.target)) closeModels(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModels(); });
renderModels();

function wireChip(c) {
  c.addEventListener('click', () => {
    input.value = c.dataset.text; autosize(); updateSend(); input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  });
}
document.querySelectorAll('.chip').forEach(wireChip);
setBusy(false);
input.focus();
post({ type: 'ready' });
</script>
</body>
</html>
